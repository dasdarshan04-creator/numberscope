[project]
name = "numberscope"
version = "1.0.0"
description = "A local-first, privacy-respecting mobile-number OSINT lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.40,<2",
    "phonenumbers>=8.13,<10",
    "pandas>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[tool.setuptools]
packages = ["numberscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; keep prose comments readable
